<html lang="en">
<head>

<body>
  <image src="fuckYou.jpg" style="width: 100%;">
  <p>Do you think it's not deserved? Click this to send it back to them:</p>
  <button id="nativeShareBtn">Share</button>
    
  <script>
let wait = setTimeout(() => alert("Fuck You"), 2000);
    
// Data object containing the text and URL to share
const shareData = {
  title: document.title,                 // Grabs current page title
  text: 'Check out this awesome website!',// Custom description
  url: "https://yeeter-idk.github.io/FuckYou/"             // Grabs current page URL
};

const shareButton = document.getElementById('nativeShareBtn');

// Add a click event listener to activate the share card
shareButton.addEventListener('click', async () => {
  // Check if the browser supports the native Web Share API
  if (navigator.share) {
    try {
      await navigator.share(shareData);
      console.log('Content shared successfully!');
    } catch (err) {
      console.error('Sharing failed or was cancelled:', err);
    }
  } else {
    navigator.clipboard.writeText("https://yeeter-idk.github.io/FuckYou/");
  }
});

  </script>
